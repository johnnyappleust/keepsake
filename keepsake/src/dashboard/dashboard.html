<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keepsake</title>
  <link rel="icon" href="../../icons/icon32.png" />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app" id="app">
    <button class="btn btn-icon menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="scrim" id="scrim" hidden></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v15.2a.8.8 0 0 1-1.28.64L12 16.9l-5.22 3.94A.8.8 0 0 1 5.5 20.2V5A1.5 1.5 0 0 1 7 3.5Z" fill="#F5F1EA"/></svg>
        </span>
        <span class="brand-name">Keepsake</span>
      </div>

      <nav class="nav" aria-label="Views">
        <a class="nav-item" href="#all" data-route="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
          <span>All saves</span><span class="count" id="countAll"></span>
        </a>
        <a class="nav-item" href="#favorites" data-route="favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.8 2.5 5.3 5.8.7-4.3 4 1.1 5.8L12 16.8l-5.1 2.8 1.1-5.8-4.3-4 5.8-.7L12 3.8Z"/></svg>
          <span>Favorites</span><span class="count" id="countFav"></span>
        </a>
        <a class="nav-item" href="#review" data-route="review">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l2.5 1.5"/></svg>
          <span>Review</span><span class="count" id="countReview"></span>
        </a>
        <a class="nav-item" href="#archive" data-route="archive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="4" rx="1"/><path d="M5 8.5v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9M10 12.5h4"/></svg>
          <span>Archive</span><span class="count" id="countArchive"></span>
        </a>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-heading">
          <span>Collections</span>
          <button class="btn btn-quiet btn-sm" id="newCollectionBtn" type="button" aria-label="New collection">＋ New</button>
        </div>
        <ul class="collection-list" id="collectionList" aria-label="Collections"></ul>
        <p class="help sidebar-help">Drag to reorder</p>
      </div>

      <nav class="nav nav-bottom" aria-label="Tools">
        <a class="nav-item" href="#import" data-route="import">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17" cy="7" r="1" fill="currentColor"/></svg>
          <span>Instagram import</span><span class="count" id="countImport"></span>
        </a>
        <a class="nav-item" href="#tabsimport" data-route="tabsimport">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9h17M8 5v4"/></svg>
          <span>Import from tabs</span>
        </a>
        <a class="nav-item" href="#settings" data-route="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span>Settings</span>
        </a>
        <a class="nav-item" href="#privacy" data-route="privacy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 5 6.2v5.3c0 4.3 3 8.2 7 9.1 4-.9 7-4.8 7-9.1V6.2l-7-2.7Z"/><path d="m9.5 12 1.8 1.8L15 10"/></svg>
          <span>Privacy</span>
        </a>
      </nav>
    </aside>

    <main class="main" id="main">
      <header class="toolbar" id="toolbar">
        <div class="toolbar-left">
          <h1 class="view-title" id="viewTitle">All saves</h1>
          <span class="view-count muted small" id="viewCount"></span>
        </div>
        <div class="toolbar-right" id="toolbarControls">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
            <input class="input" id="searchInput" type="search" placeholder="Search titles, notes, retailers, prices" aria-label="Search" />
          </label>
          <label class="sr-only" for="sortSelect">Sort</label>
          <select class="select control" id="sortSelect">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
          </select>
          <label class="sr-only" for="retailerSelect">Filter by retailer</label>
          <select class="select control" id="retailerSelect">
            <option value="">All retailers</option>
          </select>
          <button class="btn control" id="selectToggle" type="button" aria-pressed="false">Select</button>
          <button class="btn btn-icon" id="themeToggle" type="button" aria-label="Toggle theme" title="Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <div class="bulkbar hidden" id="bulkbar" role="region" aria-label="Bulk actions">
        <span id="bulkCount">0 selected</span>
        <button class="btn btn-sm" id="bulkAll" type="button">Select all</button>
        <button class="btn btn-sm" id="bulkMove" type="button">Move to…</button>
        <button class="btn btn-sm" id="bulkFav" type="button">Favorite</button>
        <button class="btn btn-sm" id="bulkArchive" type="button">Archive</button>
        <button class="btn btn-sm hidden" id="bulkAi" type="button">Find products (AI)</button>
        <button class="btn btn-sm btn-danger" id="bulkDelete" type="button">Delete</button>
        <span class="grow"></span>
        <button class="btn btn-sm btn-quiet" id="bulkCancel" type="button">Done</button>
      </div>

      <section class="view" id="view" tabindex="-1" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="../instagram/adapter.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
