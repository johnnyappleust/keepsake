name: Release to Chrome Web Store

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.3"
        required: true

env:
  EXTENSION_ID: akekjlfpdbkghhopdkgnfnkcibonaiom

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Verify manifest version matches tag
        run: |
          TAG_VERSION="${{ steps.tag.outputs.name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          MANIFEST_VERSION=$(node -p "require('./keepsake/manifest.json').version")
          echo "Tag version:      $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match manifest.json version $MANIFEST_VERSION. Bump the version in keepsake/manifest.json and re-tag."
            exit 1
          fi

      - name: Package extension
        run: |
          cd keepsake
          zip -r ../keepsake.zip . \
            -x "README.md" \
            -x "LICENSE" \
            -x "PRIVACY.md" \
            -x ".*" \
            -x "**/.DS_Store"
          cd ..
          unzip -l keepsake.zip

      - name: Get access token
        id: auth
        env:
          SA_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
        run: |
          # Sign a JWT with the service account key and exchange it for an access token.
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          echo "$SA_KEY" | jq -r '.private_key' > sa.pem
          EMAIL=$(echo "$SA_KEY" | jq -r '.client_email')
          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          CLAIMS=$(jq -cn --arg iss "$EMAIL" --argjson now "$NOW" '{
            iss: $iss,
            scope: "https://www.googleapis.com/auth/chromewebstore",
            aud: "https://oauth2.googleapis.com/token",
            iat: $now,
            exp: ($now + 3600)
          }' | b64url)
          SIG=$(printf '%s.%s' "$HEADER" "$CLAIMS" | openssl dgst -sha256 -sign sa.pem | b64url)
          rm -f sa.pem
          RESPONSE=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" \
            -d "assertion=${HEADER}.${CLAIMS}.${SIG}")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Failed to obtain access token for the service account."
            echo "$RESPONSE" | jq 'del(.access_token)'
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload package to Chrome Web Store
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @keepsake.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:upload")
          echo "$RESPONSE"
          STATE=$(echo "$RESPONSE" | jq -r '.uploadState // empty')
          if [ "$STATE" != "SUCCEEDED" ] && [ "$STATE" != "IN_PROGRESS" ]; then
            echo "::error::Upload failed with state: ${STATE:-none}"
            exit 1
          fi

      - name: Publish item
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Length: 0" \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:publish")
          echo "$RESPONSE"
          if [ "$(echo "$RESPONSE" | jq 'has("error")')" == "true" ]; then
            echo "::error::Publish failed."
            exit 1
          fi

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" keepsake.zip \
            --title "${{ steps.tag.outputs.name }}" \
            --generate-notes \
            --repo "${{ github.repository }}" || \
          gh release upload "${{ steps.tag.outputs.name }}" keepsake.zip \
            --repo "${{ github.repository }}" --clobber
